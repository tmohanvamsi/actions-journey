name: secret-check
on: push
jobs:
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checking secret
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "$APP_TOKEN is configured successfully"
          else
            echo "ERROR: APP_TOKEN is missing"
          fi
