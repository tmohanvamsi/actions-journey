name: env
on: push
env:
  APP_NAME: journey
jobs:
  env-demo:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: info
    steps:
      - name: Print App
        run: |
          echo "APP_NAME is: $APP_NAME"
          echo "LOG_LEVEL is: $LOG_LEVEL"
      - name: Print Log Levels
        env:
          LOG_LEVEL: debug
        run: |
          echo "APP_NAME is: $APP_NAME"
          echo "LOG_LEVEL is: $LOG_LEVEL"
