name: context
on: push
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - name: Print Workflow Context
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          echo "Repository: $REPOSITORY"
          echo "Branch: $BRANCH"
          echo "Commit: $COMMIT"
          echo "Event: $EVENT" 
          echo "Runner OS: $RUNNER_OS"
